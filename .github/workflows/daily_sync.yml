name: Nightly CleverTap Sync

on:
  schedule:
    # 20:30 UTC = 2:00 AM IST (Indian Standard Time) every night
    - cron: '30 20 * * *'
  workflow_dispatch: # Allows manual trigger anytime from UI

jobs:
  run-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/python-version@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Run Pipeline
        env:
          MB_PASSWORD: ${{ secrets.MB_PASSWORD }}
          CT_PASSCODE: ${{ secrets.CT_PASSCODE }}
        run: python main.py
